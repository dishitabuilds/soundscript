name: Production database check

on:
  schedule:
    # Four real database reads per day, with room for Render to idle in between.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: production-database-check
  cancel-in-progress: false

jobs:
  ping:
    name: Check the database through the API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      API_URL: https://soundscript-api-55nk.onrender.com
      SUPABASE_PROJECT_REF: bdkqxnavmwxyvxftjhuy

    steps:
      - name: Verify the database answers
        run: |
          # Allow for a Render cold start and transient database errors.
          if ! curl --fail-with-body --silent --show-error --max-time 80 \
              --retry 2 --retry-delay 10 --output response.json \
              "$API_URL/api/keepalive" ||
              ! jq -e '.ok == true and .db == true' response.json > /dev/null; then
            echo "::error::The database check failed. Check the API and Supabase project status: https://supabase.com/dashboard/project/${SUPABASE_PROJECT_REF}"
            exit 1
          fi
          echo "The production database answered."
